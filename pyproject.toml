[project]
name = "epistemic-agents"
version = "0.1.0"
description = "Structured epistemological communication between AI models"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
telegram = [
    "python-telegram-bot>=21.0",
]
embeddings = [
    "sentence-transformers>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epistemic_agents"]
